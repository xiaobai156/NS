name: P1 extraction accuracy validation
on:
  push:
    branches: [fix/data-accuracy-p1-20260909]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p1-extraction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message || '', '[p1-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python unit-test dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Apply P1 extraction accuracy repair
        run: |
          python tools/apply_p1_extraction_accuracy.py
          python tools/refine_p1_extraction_accuracy.py
      - name: P1 extraction acceptance tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=P1Extraction' --logger 'trx;LogFileName=p1.trx' --results-directory test-results
      - name: Windows Debug regression tests
        if: ${{ !cancelled() }}
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets&Category!=ReauditAccuracy' --logger 'trx;LogFileName=debug.trx' --results-directory test-results
      - name: Windows Release regression tests
        if: ${{ !cancelled() }}
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets&Category!=ReauditAccuracy' --logger 'trx;LogFileName=release.trx' --results-directory test-results
      - name: Python regression tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-extraction-${{ github.sha }}
          path: test-results
      - name: Commit tested P1 source to repair branch
        if: success()
        shell: pwsh
        run: |
          git add -- OcrLineTool.App/RuleEngine.cs OcrLineTool.App/RuleCatalog.cs
          if (git diff --cached --quiet) { throw 'P1 patch produced no tested source change.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close P1 extraction ambiguity paths [p1-applied]'
          git push origin HEAD:fix/data-accuracy-p1-20260909
