name: Post-closure safety mainline validation

on:
  push:
    branches: [fix/post-closure-safety-mainline-20260910]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-closure-safety-mainline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[post-closure-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 Python 测试依赖
        run: python -m pip install numpy pillow
      - name: 配置托管测试桌面
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: 应用本轮安全修复
        shell: pwsh
        run: |
          $patches = @(
            'tools/apply_post_closure_safety.py',
            'tools/apply_post_closure_nearby_boundary_followup.py',
            'tools/apply_post_closure_complement.py',
            'tools/apply_post_closure_halfwave.py',
            'tools/apply_post_closure_repeated_markers.py'
          )
          foreach ($patch in $patches) {
            python $patch
            if ($LASTEXITCODE -ne 0) {
              Write-Error "补丁脚本失败: $patch"
              exit $LASTEXITCODE
            }
          }
      - name: 准确性专项回归
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy'
      - name: Windows Debug 全量回归
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Windows Release 全量回归
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Python 回归
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: 提交已验证生产代码
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OcrLineTool.App/RuleEngine.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: close post-closure extraction safety gaps on latest main [post-closure-applied]"
            git push origin HEAD:${{ github.ref_name }}
          }
