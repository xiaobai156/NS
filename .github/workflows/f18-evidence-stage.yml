name: F18 structured evidence validation
on:
  push:
    branches: [fix/f13-f16-f18-20260909]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: f18-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python unit-test dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Apply structured cloud evidence patch
        run: |
          python tools/apply_f18_clients.py
          python tools/refine_f18_clients.py
      - name: Accuracy tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy'
      - name: Windows Debug regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Windows Release regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Python regression tests
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Commit tested source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OcrLineTool.App/RuleEngine.cs OcrLineTool.App/OcrClients.cs OcrLineTool.App/CloudImageDeduplicator.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat: carry structured OCR evidence through cloud clients [f18-cloud-applied]"
            git push origin HEAD:${{ github.ref_name }}
          }
