name: P2 source integrity validation
on:
  push:
    branches: [fix/data-accuracy-p2-20260909]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2-source-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Second-pass full acceptance tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy' --logger 'trx;LogFileName=p2-baseline.trx' --results-directory test-results
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-baseline-${{ github.sha }}
          path: test-results
