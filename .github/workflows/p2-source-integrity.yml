name: P2 source integrity validation
on:
  push:
    branches: [fix/data-accuracy-p2-20260909]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p2-source-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message || '', '[p2-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python unit-test dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Apply P2 source/downstream integrity repair
        run: |
          python tools/apply_p2_source_integrity.py
          python tools/refine_p2_source_integrity.py
      - name: Second-pass full acceptance tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy' --logger 'trx;LogFileName=p2.trx' --results-directory test-results
      - name: Windows Debug regression tests
        if: ${{ !cancelled() }}
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets' --logger 'trx;LogFileName=debug.trx' --results-directory test-results
      - name: Windows Release regression tests
        if: ${{ !cancelled() }}
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets' --logger 'trx;LogFileName=release.trx' --results-directory test-results
      - name: Python regression tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-source-integrity-${{ github.sha }}
          path: test-results
      - name: Commit tested P2 source to repair branch
        if: success()
        shell: pwsh
        run: |
          git add -- OcrLineTool.App/RuleEngine.cs OcrLineTool.App/LocalCandidatePlanner.cs OcrLineTool.App/MainForm.cs OcrLineTool.App/VisualTemplateMatcher.cs OcrLineTool.App/OcrClients.cs OcrLineTool.App/ResultDistributor.cs OcrLineTool.App/OwnedResultWriter.cs
          if (git diff --cached --quiet) { throw 'P2 patch produced no tested source change.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close source and downstream integrity gaps [p2-applied]'
          git push origin HEAD:fix/data-accuracy-p2-20260909
