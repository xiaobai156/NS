name: Final F13 F16 F18 closure validation
on:
  push:
    branches: [fix/f13-f16-f18-20260909]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: f13-f16-f18-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[f18-final-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python unit-test dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Apply final closure patch
        run: |
          python tools/apply_f13_f16_f18_final_closure.py
          python tools/refine_final_ui_compat.py
      - name: Accuracy closure tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy'
      - name: Windows Debug regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Windows Release regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Python regression tests
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Commit tested closure
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OcrLineTool.App/MainForm.cs OcrLineTool.App/RecognitionStateStore.cs OcrLineTool.App/RuleEngine.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: close F13 F16 F18 evidence boundaries [f18-final-applied]"
            git push origin HEAD:${{ github.ref_name }}
          }
