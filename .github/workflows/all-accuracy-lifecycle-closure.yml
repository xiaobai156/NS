name: Complete accuracy and lifecycle closure
on:
  push:
    branches: [fix/final-accuracy-lifecycle-20260910]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: all-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[all-closure-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Apply complete repair
        run: |
          python tools/apply_latest_accuracy_patch.py
          python tools/apply_latest_accuracy_compat.py
          python tools/apply_latest_accuracy_compat2.py
          python tools/apply_latest_accuracy_compat3.py
          python tools/apply_final_lifecycle_closure.py
          python tools/apply_final_crop_creation_pin.py
          python tools/apply_template_version_pin.py
          python tools/apply_retry_template_evidence_scope.py
      - name: Accuracy and lifecycle regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy'
      - name: Windows Debug regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Windows Release regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Python regression tests
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Commit tested production source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OcrLineTool.App/RuleEngine.cs OcrLineTool.App/OcrEvidence.cs OcrLineTool.App/OcrClients.cs OcrLineTool.App/ResultFilePaths.cs OcrLineTool.App/RecognitionStateStore.cs OcrLineTool.App/MainForm.cs OcrLineTool.App/VisualTemplateMatcher.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: close final accuracy and evidence lifecycle gaps [all-closure-applied]"
            git push origin HEAD:${{ github.ref_name }}
          }
