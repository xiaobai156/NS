name: Residual accuracy stage A
on:
  push:
    branches: [fix/f01-f18-final-20260909]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: residual-stage-a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[stage-a-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python unit-test dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Fix patch helper escaping and method anchor
        shell: pwsh
        run: |
          $p = 'tools/apply_residual_accuracy_stage_a.py'
          $s = Get-Content $p -Raw
          $s = $s.Replace('re.subn(pattern, repl, text, count=1, flags=flags)', 're.subn(pattern, lambda _match: repl, text, count=1, flags=flags)')
          Set-Content -Path $p -Value $s -Encoding UTF8
          python tools/fix_stage_a_method_anchor.py
      - name: Apply stage A source patch
        run: python tools/apply_residual_accuracy_stage_a.py
      - name: Accuracy regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy'
      - name: Windows Debug regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Windows Release regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Python regression tests
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Commit tested stage A source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OcrLineTool.App/RuleEngine.cs OcrLineTool.App/OcrEvidence.cs OcrLineTool.App/paddle_local_ocr.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: close residual extraction and evidence gaps [stage-a-applied]"
            git push origin HEAD:${{ github.ref_name }}
          }
