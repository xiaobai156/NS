name: Final F03 F14 closure validation
on:
  push:
    branches: [fix/f03-f14-final-closure-20260910]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: final-f03-f14-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[f03-f14-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python unit-test dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Prepare safe patch runner
        shell: pwsh
        run: |
          $path = 'tools/apply_final_f03_f14_closure.py'
          $text = Get-Content $path -Raw
          $text = $text.Replace('re.subn(pattern, replacement, text, count=count, flags=re.S)', 're.subn(pattern, lambda _: replacement, text, count=count, flags=re.S)')
          Set-Content -Path $path -Value $text -Encoding utf8
      - name: Apply final F03 F14 patch
        run: python tools/apply_final_f03_f14_closure.py
      - name: Accuracy regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy'
      - name: Windows Debug regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Windows Release regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Python regression tests
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Commit tested final closure source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OcrLineTool.App/RuleEngine.cs OcrLineTool.App/RecognitionStateStore.cs OcrLineTool.App/MainForm.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: close final F03 and F14 gaps [f03-f14-applied]"
            git push origin HEAD:${{ github.ref_name }}
          }
