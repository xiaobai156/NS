name: Latest accuracy closure validation
on:
  push:
    branches: [fix/final-accuracy-lifecycle-20260910]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: latest-accuracy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[latest-accuracy-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Apply extraction and evidence patch
        run: python tools/apply_latest_accuracy_patch.py
      - name: Accuracy regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy'
      - name: Windows Debug regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Windows Release regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Python regression tests
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Commit tested source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OcrLineTool.App/RuleEngine.cs OcrLineTool.App/OcrEvidence.cs OcrLineTool.App/OcrClients.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: close latest extraction and evidence gaps [latest-accuracy-applied]"
            git push origin HEAD:${{ github.ref_name }}
          }
