name: Residual accuracy round 2

on:
  push:
    branches: [fix/data-accuracy-residual-20260910]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: residual-accuracy-round2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[residual-r2-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Apply residual accuracy repairs
        run: |
          python -X utf8 tools/apply_residual_accuracy_round2.py
          python -X utf8 tools/apply_residual_accuracy_round2_compat.py
      - name: Reaudit accuracy tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy'
      - name: Windows Debug regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Windows Release regression tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets'
      - name: Python regression tests
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Commit validated production source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OcrLineTool.App/RuleEngine.cs OcrLineTool.App/OcrEvidence.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: close residual data-accuracy gaps [residual-r2-applied]"
            git push origin HEAD:${{ github.ref_name }}
          }
