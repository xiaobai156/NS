name: P0 data accuracy validation
on:
  push:
    branches: [fix/data-accuracy-p0-20260909]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-data-accuracy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python unit-test dependencies
        run: python -m pip install numpy pillow
      - name: Configure hosted test desktop
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/Set-TestDisplay.ps1
      - name: Focused data-accuracy acceptance tests
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category=ReauditAccuracy' --logger 'trx;LogFileName=reaudit.trx' --results-directory test-results
      - name: Windows Debug regression tests
        if: ${{ !cancelled() }}
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Debug --filter 'Category!=CUDA&Category!=ModelAssets' --logger 'trx;LogFileName=debug.trx' --results-directory test-results
      - name: Windows Release regression tests
        if: ${{ !cancelled() }}
        run: dotnet test OcrLineTool.Tests/OcrLineTool.Tests.csproj -c Release --filter 'Category!=CUDA&Category!=ModelAssets' --logger 'trx;LogFileName=release.trx' --results-directory test-results
      - name: Python regression tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s OcrLineTool.Tests -p '*_test.py'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-data-accuracy-${{ github.sha }}
          path: test-results
